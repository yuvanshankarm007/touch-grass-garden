name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check .
      - name: Validate crop data
        run: |
          python - <<'PY'
          import json
          import pathlib
          import garden
          for pack_file in sorted(pathlib.Path("crop_packs").glob("*.json")):
              json.loads(pack_file.read_text(encoding="utf-8"))
              if not pack_file.stem.startswith("_"):
                  garden.load_crops(pack_file.stem)
          PY
      - name: Run unit tests
        run: pytest -q
      - name: Smoke test the app headlessly
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app.py", default_timeout=30).run()
          assert not at.exception, at.exception
          print("app loads without errors")
          PY
